
services:
  vertica:
    image: opentext/vertica-k8s:25.4.0-0-multiarch
    container_name: social_vertica
    hostname: vertica
    user: root

    entrypoint: ["/bin/bash", "/vertica-entrypoint.sh"]

    environment:
      VERTICA_DB_NAME: social_dwh
      VERTICA_DB_USER: dbadmin
      VERTICA_DB_PASSWORD: "vertica123"
      VERTICA_DATA_PATH: /data

    ports:
      - "127.0.0.1:5433:5433"

    volumes:
      - vertica_data:/data
      - ./docker/vertica-entrypoint.sh:/vertica-entrypoint.sh:ro
      - ./data:/csv:ro
      - ./sql:/sql:ro

volumes:
  vertica_data:
